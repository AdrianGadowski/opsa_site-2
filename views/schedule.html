<style>
  /* ===== Harmonogram pracy ===== */
  .sh-banner {
    display: none; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px;
    font-size: 0.9rem; font-weight: 500;
  }
  .sh-banner.visible { display: flex; }
  .sh-banner.success { background: rgba(16, 185, 129, 0.1); color: #0b7a57; border: 1px solid rgba(16, 185, 129, 0.35); }
  .sh-banner.warning { background: rgba(252, 212, 68, 0.25); color: #7a5c00; border: 1px solid rgba(224, 188, 60, 0.6); }

  /* Wybór tygodnia w zielonym nagłówku */
  .sh-weekpick { display: flex; align-items: center; gap: 6px; }
  .sh-weekpick button {
    width: 42px; height: 44px; border-radius: 12px; cursor: pointer; font-size: 0.9rem;
    border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.12); color: #fff;
  }
  .sh-weekpick button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.22); }
  .sh-weekpick button:disabled { opacity: 0.4; cursor: default; }
  .sh-weekpick button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .sh-table td { vertical-align: middle; padding: 10px 14px; }
  .sh-table th, .sh-table td { text-align: center; }
  .sh-table th:first-child, .sh-table td.sh-name { text-align: left; }
  .sh-name { font-weight: 600; color: var(--primary); white-space: nowrap; }
  .sh-biz { background: rgba(8, 88, 75, 0.06); color: var(--primary); padding: 4px 9px; border-radius: 4px; font-size: 0.82rem; font-weight: 600; border: 1px solid rgba(8, 88, 75, 0.15); white-space: nowrap; }
  .sh-table tr.is-set { background: rgba(16, 185, 129, 0.05); }

  /* Poprzednie tygodnie (informacyjnie) */
  .sh-history { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sh-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: #F1F3F5; color: #4B5563; font-size: 0.78rem; white-space: nowrap; }
  .sh-chip b { font-weight: 700; color: #6B7280; font-size: 0.7rem; }
  .sh-chip.none { background: transparent; color: #B0B5BC; }

  /* Ustawianie godzin */
  .sh-edit { display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .sh-time {
    width: 86px; padding: 7px 8px; border-radius: 6px; border: 1.5px solid #D9D9D9; background: #fff;
    font-family: inherit; font-size: 0.88rem; text-align: center; color: var(--text-dark); cursor: pointer;
  }
  .sh-time:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(8, 88, 75, 0.1); }
  .sh-presets { display: inline-flex; gap: 4px; margin-left: 4px; }
  .sh-preset {
    min-width: 30px; height: 30px; padding: 0 7px; border-radius: 7px; cursor: pointer;
    border: 1.5px solid #D9D9D9; background: #fff; color: #4B5563; font-family: inherit; font-size: 0.76rem; font-weight: 700;
  }
  .sh-preset:hover { border-color: var(--primary); color: var(--primary); }
  .sh-preset.on { background: var(--accent); border-color: var(--accent-hover); color: #03241E; }
  .sh-preset:focus-visible, .sh-clear:focus-visible { outline: 3px solid rgba(8, 88, 75, 0.35); outline-offset: 1px; }
  .sh-clear { padding: 6px 8px; color: var(--text-muted); }
  .sh-raw { margin-top: 5px; font-size: 0.74rem; color: #B45309; }

  .sh-status { min-width: 120px; font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
  .sh-status.saved { color: #0b7a57; font-weight: 600; }
  .sh-status.error { color: var(--danger); font-weight: 600; white-space: normal; }
  .sh-status.hint { color: #B45309; }

  .sh-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border-color); }
  .sh-toolbar .info { font-size: 0.86rem; color: var(--text-muted); }

  @media (max-width: 900px) {
    .sh-filters { grid-template-columns: 1fr 1fr !important; }
  }
  @media (max-width: 768px) {
    .sh-filters > :first-child { grid-column: 1 / -1; }
    .sh-weekpick { width: 100%; }
    .sh-weekpick select { flex: 1; min-width: 0; }
    .sh-toolbar { padding: 12px; }
    .sh-toolbar button { width: 100%; }
    /* na karcie: historia w jednej linii, pole godzin na całą szerokość pod podpisem */
    .sh-history { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; }
    #main-content .sh-table tbody td:nth-child(5) { padding-left: 0 !important; padding-top: 26px !important; text-align: left !important; }
    .sh-edit { justify-content: flex-start; }
    .sh-time { width: 92px; padding: 9px 8px; }
    .sh-preset { min-width: 36px; height: 36px; }
    .sh-status { min-width: 0; }
    #main-content .sh-table tbody tr.is-set { background: #F3FBF7; }
  }
</style>

<div class="page-hero">
  <div>
    <div class="eyebrow">Planowanie</div>
    <h3>Harmonogram pracy</h3>
    <p>Ustal godziny pracy każdego pracownika na wybrany tydzień. Zmiany zapisują się od razu, a pracownik widzi je na swojej stronie.</p>
  </div>
  <div class="page-hero-actions">
    <div class="sh-weekpick">
      <button type="button" id="sh-prev" onclick="shStepWeek(-1)" title="Poprzedni tydzień" aria-label="Poprzedni tydzień"><i class="fa-solid fa-chevron-left"></i></button>
      <select id="sh-week" class="form-control" aria-label="Tydzień" onchange="shOnWeekChange()"></select>
      <button type="button" id="sh-next" onclick="shStepWeek(1)" title="Następny tydzień" aria-label="Następny tydzień"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>
</div>

<div id="sh-banner" class="sh-banner" role="status"></div>

<!-- Filtry -->
<div class="card" style="margin-bottom: 20px; padding: 16px 20px;">
  <div class="sh-filters" style="display: grid; grid-template-columns: 2fr 1.2fr 1.2fr auto; gap: 14px; align-items: end;">
    <div class="form-group" style="margin-bottom: 0;">
      <label for="sh-filter-search" style="font-size: 0.8rem; color: var(--text-muted);">Szukaj pracownika</label>
      <div style="position: relative;">
        <input type="text" id="sh-filter-search" class="form-control" placeholder="Imię lub nazwisko..." oninput="shRenderTable()" style="padding-left: 36px;" autocomplete="off" />
        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem;"></i>
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 0;">
      <label for="sh-filter-business" style="font-size: 0.8rem; color: var(--text-muted);">Firma</label>
      <select id="sh-filter-business" class="form-control" onchange="shRenderTable()">
        <option value="">Wszystkie firmy</option>
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 0;">
      <label for="sh-filter-dept" style="font-size: 0.8rem; color: var(--text-muted);">Dział</label>
      <select id="sh-filter-dept" class="form-control" onchange="shRenderTable()">
        <option value="">Wszystkie działy</option>
      </select>
    </div>

    <div>
      <button type="button" class="btn-secondary" style="height: 42px; padding: 0 16px; font-size: 0.85rem;" onclick="shResetFilters()" title="Wyczyść filtry">
        <i class="fa-solid fa-rotate-left" style="margin-right: 6px;"></i> Reset
      </button>
    </div>
  </div>
</div>

<!-- Tabela pracowników -->
<div class="card" style="padding: 0; overflow: hidden;">
  <div class="sh-toolbar">
    <span class="info" id="sh-info"></span>
    <button type="button" id="sh-copy-btn" class="btn-secondary" style="width: auto; padding: 9px 16px; font-size: 0.85rem;" onclick="shCopyPrevious()"
            title="Pracownikom bez godzin w tym tygodniu wpisuje godziny z tygodnia poprzedniego. Niczego nie nadpisuje.">
      <i class="fa-solid fa-copy" style="margin-right: 8px;"></i> Uzupełnij puste z poprzedniego tygodnia
    </button>
  </div>

  <div style="overflow-x: auto;">
    <table class="users-table sh-table" style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr>
          <th>Pracownik</th>
          <th>Firma</th>
          <th>Dział</th>
          <th>Ostatnie 3 tygodnie</th>
          <th id="sh-col-current">Godziny pracy</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="sh-table-body">
        <tr>
          <td colspan="6" style="text-align: center; padding: 30px; color: var(--text-muted);">
            <i class="fa-solid fa-spinner fa-spin"></i> Ładowanie harmonogramu...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
