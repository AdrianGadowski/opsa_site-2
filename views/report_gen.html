<style>
  /* ===== Generowanie raportów (js/report_gen.js) ===== */
  .rg-monthpick { display: flex; align-items: center; gap: 6px; }
  .rg-monthpick button {
    width: 42px; height: 44px; flex-shrink: 0; border-radius: 12px; cursor: pointer; font-size: 0.9rem;
    border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.12); color: #fff;
  }
  .rg-monthpick button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.22); }
  .rg-monthpick button:disabled { opacity: 0.4; cursor: default; }
  .rg-month-label {
    width: 200px; height: 44px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
    border-radius: 12px; background: rgba(255, 255, 255, 0.95); color: var(--primary); font-weight: 700; font-size: 0.95rem; white-space: nowrap;
  }

  .rg-banner { display: none; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 0.9rem; font-weight: 500; }
  .rg-banner.visible { display: flex; }
  .rg-banner.success { background: #DDF1E7; color: #0B5D44; }
  .rg-banner.warning { background: #FFF8DF; color: #6B5507; border: 1px solid #F2D98A; }
  .rg-banner.error { background: #FDF1F1; color: #9B1C1C; border: 1px solid #F3C4C5; }

  .rg-closed { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 20px; text-align: center; color: var(--text-muted); }
  .rg-closed i { font-size: 2rem; color: #C4C8CE; }
  .rg-closed b { color: var(--text-dark); font-size: 1rem; }

  /* Firmy: raport zbiorczy i raporty pracowników */
  .rg-all { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .rg-all h4 { margin: 0; font-size: 1rem; color: var(--text-dark); }
  .rg-all-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .rg-firms { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .rg-firm { background: #fff; border: 1px solid var(--border-color); border-radius: 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .rg-firm-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
  .rg-firm-head b { font-size: 1.02rem; color: var(--text-dark); }
  .rg-firm-head img { height: 28px; max-width: 110px; object-fit: contain; }
  .rg-firm-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .rg-firm-nums span { display: block; font-size: 0.72rem; color: var(--text-muted); }
  .rg-firm-nums b { font-size: 1.02rem; font-variant-numeric: tabular-nums; }
  .rg-firm-nums .ok { color: #0B7A57; }
  .rg-firm-nums .no { color: var(--danger); }
  .rg-firm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .rg-btn {
    min-height: 40px; padding: 6px 12px; border-radius: 10px; border: 1.5px solid #D9D9D9; background: #fff; cursor: pointer; font-family: inherit;
    font-size: 0.82rem; font-weight: 700; color: var(--primary); display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-align: center;
  }
  .rg-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(8, 88, 75, 0.06); }
  .rg-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .rg-btn.main { background: var(--primary); border-color: var(--primary); color: #fff; }
  .rg-btn.main:hover:not(:disabled) { background: #053D34; }

  /* Pracownicy */
  .rg-tools { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border-color); }
  .rg-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .rg-table th { padding: 10px 14px; text-align: center; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.03em; color: #4B5563; background: #F9FAFB; border-bottom: 1px solid var(--border-color); }
  .rg-table th:first-child, .rg-table td:first-child { text-align: left; }
  .rg-table td { padding: 8px 14px; text-align: center; border-bottom: 1px solid #F0F0F0; font-variant-numeric: tabular-nums; }
  .rg-table td b { color: var(--text-dark); }
  .rg-table td.ok { color: #0B7A57; font-weight: 700; }
  .rg-table td.no { color: var(--danger); font-weight: 700; }
  .rg-table .rg-btn { min-height: 32px; padding: 3px 12px; }
  .rg-empty { padding: 30px; text-align: center; color: var(--text-muted); }

  @media (max-width: 768px) {
    .rg-monthpick { width: 100%; }
    .rg-month-label { flex: 1; width: auto; min-width: 0; }
    .rg-all-btns, .rg-all-btns .rg-btn { width: 100%; }
    .rg-tools { grid-template-columns: 1fr; padding: 12px; }
  }
</style>

<div class="page-hero">
  <div>
    <div class="eyebrow">Dokumenty</div>
    <h3>Generowanie raportów</h3>
    <p>Raporty PDF pracowników i zestawienia zbiorcze firm. Dostępne po zamknięciu miesiąca, tylko z zatwierdzonych raportów.</p>
  </div>
  <div class="page-hero-actions">
    <div class="rg-monthpick">
      <button type="button" onclick="rgStep(-1)" title="Poprzedni miesiąc" aria-label="Poprzedni miesiąc"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="rg-month-label" id="rg-month" aria-live="polite">—</span>
      <button type="button" id="rg-next" onclick="rgStep(1)" title="Następny miesiąc" aria-label="Następny miesiąc"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>
</div>

<div id="rg-banner" class="rg-banner" role="status"></div>
<div id="rg-content"></div>
